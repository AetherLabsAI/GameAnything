# Does gameanything install and work for a user on Linux, Windows and macOS? See docs/cross-platform.md.
# No game is installed on the runners: the tests use fake game folders and fake saves in temp dirs, and nothing goes over the network.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:                      # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # the public repository's standard runners cost nothing: all three systems on every push and pull request
        include:
          - {os: ubuntu-latest, python: "3.10"}
          - {os: ubuntu-latest, python: "3.12"}
          - {os: windows-latest, python: "3.12"}
          - {os: macos-latest, python: "3.12"}
    defaults:
      run:
        shell: bash               # Git Bash on Windows: the same commands on every system
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      # deliberately NOT setting PYTHONUTF8 / PYTHONIOENCODING: users do not have them, and the tests must see Windows' real defaults
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (no optional extras)
        run: |
          python -m pip install -e .
          python -m pip install pytest setuptools    # setuptools: tests/test_wheel.py builds the wheel offline and runs the installed copy

      - name: Tests
        run: python -m pytest -q -rs

      - name: Tests again, any text IO without an encoding is an error (what breaks Chinese on Windows)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest -q -W error::EncodingWarning

      - name: CLI smoke test
        env:
          GAMEANYTHING_HOME: ${{ runner.temp }}/m2w home
          GAMEANYTHING_DATA: ${{ runner.temp }}/m2w data
        run: |
          set -euo pipefail
          gameanything --help > /dev/null
          gameanything project new --title "CI smoke test" --dir "$RUNNER_TEMP/m2w projects/smoke test"
          gameanything project list | tee "$RUNNER_TEMP/list.txt"
          grep -q "CI smoke test" "$RUNNER_TEMP/list.txt"
          m2w --help | grep "usage: gameanything" > /dev/null                                 # the old command name still works
          env -u GAMEANYTHING_HOME -u GAMEANYTHING_DATA M2W_HOME="$GAMEANYTHING_HOME" M2W_DATA="$GAMEANYTHING_DATA" m2w project list | grep "CI smoke test" > /dev/null   # and the old variable names
          gameanything native doctor
          gameanything native doctor --json > "$RUNNER_TEMP/doctor.json"
          python .github/scripts/doctor_check.py "$RUNNER_TEMP/doctor.json"

      - name: UI smoke test
        env:
          GAMEANYTHING_HOME: ${{ runner.temp }}/m2w home
          GAMEANYTHING_DATA: ${{ runner.temp }}/m2w data
        run: python .github/scripts/ui_smoke.py "$RUNNER_TEMP/m2w projects/smoke test"
