    image: /media/1_ingest/derived/thumbs/photo_1.jpg
  - n: 2
    text: 第一排右边那两位长辈是谁？游戏里怎么称呼他们？
    image: /media/1_ingest/derived/thumbs/photo_2.jpg
  - n: 3
    text: 有没有素材里没有、但一定要保留的东西？
