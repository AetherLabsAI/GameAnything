<!doctype html>
<html lang="zh" data-default-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameAnything</title>
<style>
/* gameanything hub: login and the user's project list (hub.js). */
@font-face { font-family:Inter; font-style:normal; font-weight:100 900; font-display:swap; src:url(/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
:root {
  --bg:#FFFFFF; --side:#FAFAFB; --hover:#F4F4F6; --ink:#18181B; --ink-2:#52525B; --mute:#9CA0AA; --rule:#ECECF0;
  --violet:#7C3AED; --violet-deep:#5B21B6; --fuchsia:#C026D3; --soft:#F6F3FD; --soft-2:#F1EBFC; --vline:#E3DCF4; --ok:#16A34A; --warn:#D97706; --bad:#B91C1C;
  --shadow:0 1px 2px rgba(24,24,27,.04), 0 4px 16px rgba(24,24,27,.05);
  --sans:Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
* { box-sizing:border-box; }
html, body { margin:0; background:var(--side); color:var(--ink); font:14px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; } button, input, select, textarea { font:inherit; }
.wrap { max-width:880px; margin:0 auto; padding:24px 16px 48px; }
.top { display:flex; align-items:center; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
.brand { display:flex; align-items:center; gap:8px; font:700 16px/1 var(--sans); } .brand b { color:var(--violet); }
.logo { width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg, var(--violet), var(--fuchsia)); display:grid; place-items:center; } .logo i { width:8px; height:8px; background:#fff; border-radius:2px; }
.top .me { margin-left:auto; color:var(--ink-2); font-size:13px; display:flex; align-items:center; gap:10px; }
.lang { display:inline-flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; } .lang button { border:0; background:#fff; padding:3px 9px; font-size:12px; cursor:pointer; color:var(--ink-2); } .lang button.on { background:var(--soft-2); color:var(--violet-deep); font-weight:600; }
.box { background:#fff; border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; margin-bottom:18px; }
.login { max-width:380px; margin:12vh auto 0; }
h2 { font-size:15px; margin:0 0 12px; } h3 { font-size:13px; color:var(--ink-2); margin:22px 0 8px; font-weight:600; }
.inp { width:100%; border:1px solid var(--rule); border-radius:9px; padding:8px 10px; background:#fff; color:var(--ink); }
.inp:focus { outline:none; border-color:var(--violet); box-shadow:0 0 0 3px var(--soft-2); }
label.fld { display:block; font-size:12.5px; color:var(--ink-2); margin:0 0 10px; } label.fld .inp { margin-top:4px; }
.btn { display:inline-flex; align-items:center; gap:6px; font:600 13px/1 var(--sans); padding:9px 14px; border-radius:999px; border:1px solid var(--violet); background:var(--violet); color:#fff; cursor:pointer; }
.btn:hover { background:var(--violet-deep); } .btn.ghost { background:#fff; color:var(--violet-deep); border-color:var(--vline); } .btn.sm { padding:5px 10px; font-size:12px; }
.btn:disabled { opacity:.5; cursor:default; }
.row { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; } .row > * { flex:1 1 140px; } .row > .btn { flex:none; }
.p { background:#fff; border:1px solid var(--rule); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
.p .h { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .p .h a.t { font-weight:600; } .p .h a.t:hover { color:var(--violet-deep); }
.p small, .muted { color:var(--mute); font-size:12px; }
.tag { font-size:11px; font-weight:600; border-radius:999px; padding:2px 8px; background:var(--soft-2); color:var(--violet-deep); }
.tag.grey { background:var(--hover); color:var(--ink-2); } .tag.warn { background:#FFFBEB; color:var(--warn); }
.p .h .right { margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.mem { margin-top:8px; border-top:1px dashed var(--rule); padding-top:8px; font-size:12.5px; }
.mem .m { display:flex; gap:8px; align-items:center; margin:3px 0; } .mem select { padding:2px 6px; border:1px solid var(--rule); border-radius:7px; background:#fff; }
.lnk { border:0; background:none; color:var(--violet-deep); cursor:pointer; padding:0; font-size:12px; }
.ask { margin-top:8px; display:grid; gap:6px; }
.bad { color:var(--bad); font-size:13px; margin-top:8px; } .note { font-size:12px; color:var(--mute); margin-top:26px; }
.warnbox { background:#FFFBEB; border:1px solid #FDE68A; color:var(--ink-2); border-radius:10px; padding:8px 12px; font-size:12.5px; margin-bottom:14px; }
a.warnbox.go { display:block; } a.warnbox.go:hover { border-color:var(--warn); color:var(--ink); }
/* account pages: 我的 Claude, 改密码, 用户管理 */
a.nav { color:var(--ink-2); padding:3px 2px; border-bottom:2px solid transparent; } a.nav:hover { color:var(--violet-deep); } a.nav.on { color:var(--violet-deep); border-bottom-color:var(--violet); font-weight:600; }
.narrow { max-width:420px; }
.status { margin:10px 0; font-size:13.5px; } .acts { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; } .res { margin-top:10px; font-size:13px; }
.tag.ok { background:#ECFDF3; color:var(--ok); } .okt { color:var(--ok); } .okbox { border-color:#BBF7D0; background:#F0FDF4; }
.btn.danger { background:var(--bad); border-color:var(--bad); } .btn.danger:hover { background:#991B1B; } .danger-t { color:var(--bad) !important; }
.steps { margin:6px 0 12px; padding-left:20px; font-size:13px; color:var(--ink-2); } .steps li { margin:4px 0; }
code, .mono { font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12.5px; } code { background:var(--hover); border-radius:5px; padding:1px 5px; word-break:break-all; }
pre.err { white-space:pre-wrap; word-break:break-word; background:#FEF2F2; color:var(--bad); border-radius:8px; padding:8px 10px; font-size:12px; margin:6px 0 0; max-height:200px; overflow:auto; }
.once { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; } .once .pw { font-size:14px; padding:4px 8px; background:#fff; border:1px solid var(--rule); }
.chk { font-size:13px; color:var(--ink-2); display:inline-flex; gap:6px; align-items:center; }
.tblw { overflow-x:auto; } .tbl { width:100%; border-collapse:collapse; font-size:13px; } .tbl th { text-align:left; font-weight:600; color:var(--ink-2); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--rule); }
.tbl td { padding:8px; border-bottom:1px solid var(--rule); vertical-align:top; } .tbl td.ops { white-space:nowrap; } .tbl td.ops .lnk { margin-right:10px; }
.modal { position:fixed; inset:0; background:rgba(24,24,27,.35); display:grid; place-items:center; padding:16px; z-index:50; }
.dlg { background:#fff; border-radius:14px; box-shadow:var(--shadow); padding:18px 20px; max-width:420px; width:100%; } .dlg p { margin:0 0 6px; } .dlg .acts { justify-content:flex-end; }
/* phones (QA 2026-10-29: the list and 用户管理 were wider than a 390 px screen): the account line wraps under the brand, tables scroll in their box */
@media (max-width:600px) {
  .wrap { padding:16px 12px 40px; }
  .top { gap:8px; margin-bottom:16px; } .top .me { margin-left:0; flex:1 1 100%; flex-wrap:wrap; gap:6px 12px; }
  .top .me > span:first-child { flex:1 1 100%; } .top .me a.nav, .top .me .btn, .top .me .lang { white-space:nowrap; flex:none; }
  .box { padding:14px; } .login { margin-top:6vh; }
  .p .h .right { margin-left:0; } .mem .m { flex-wrap:wrap; }
  .tbl th, .tbl td { white-space:nowrap; } .tblw { margin:0 -14px; padding:0 14px; }
  .once { word-break:break-all; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="/i18n.js"></script>
<script src="/hub.js"></script>
</body>
</html>
