<!doctype html>
<html lang="zh" data-default-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameAnything</title>
<style>
/* Conversation shell (design3): sidebar, the project conversation with cards, and the workspace (the app pages, embedded with ?embed=1). */
@font-face { font-family:Inter; font-style:normal; font-weight:100 900; font-display:swap; src:url(/fonts/inter-latin-wght-normal.woff2) format("woff2"); }
:root {
  --bg:#FFFFFF; --side:#FAFAFB; --hover:#F4F4F6; --ink:#18181B; --ink-2:#52525B; --mute:#9CA0AA; --rule:#ECECF0;
  --violet:#7C3AED; --violet-deep:#5B21B6; --fuchsia:#C026D3; --soft:#F6F3FD; --soft-2:#F1EBFC; --vline:#E3DCF4; --ok:#16A34A; --warn:#D97706;
  --shadow:0 1px 2px rgba(24,24,27,.04), 0 4px 16px rgba(24,24,27,.05); --shadow-lg:0 10px 30px rgba(43,37,64,.10);
  --sans:Inter, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
}
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#fff; color:var(--ink); font:14px/1.6 var(--sans); -webkit-font-smoothing:antialiased; }
a { color:inherit; text-decoration:none; } button { font:inherit; }
svg.i { width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex:none; }
.px { image-rendering:pixelated; }
.app { display:grid; grid-template-columns: 220px var(--chat-w, 460px) minmax(0, 1fr); height:100vh; }

/* sidebar */
.sidenav { background:var(--side); border-right:1px solid var(--rule); padding:14px 10px; display:flex; flex-direction:column; gap:2px; overflow:auto; }
.brand { display:flex; align-items:center; gap:8px; padding:4px 8px 14px; font:700 15px/1 var(--sans); } .brand b { color:var(--violet); }
.logo { width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg, var(--violet), var(--fuchsia)); display:grid; place-items:center; } .logo i { width:8px; height:8px; background:#fff; border-radius:2px; }
.proj { display:flex; align-items:center; gap:9px; padding:7px 9px; border:1px solid var(--rule); background:#fff; border-radius:10px; margin:0 0 12px; box-shadow:var(--shadow); }
.proj img { width:26px; height:26px; border-radius:7px; object-fit:cover; } .proj b { display:block; font-size:12.5px; font-weight:600; line-height:1.2; } .proj span { font-size:11px; color:var(--mute); }
.navi { display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:8px; color:var(--ink-2); font-size:13px; font-weight:500; cursor:pointer; }
.navi:hover { background:var(--hover); } .navi.cur { background:#fff; color:var(--ink); box-shadow:var(--shadow); }
.navi .cnt { margin-left:auto; font-size:10.5px; font-weight:600; color:var(--violet); background:var(--soft-2); border-radius:10px; padding:0 7px; }
.sidelabel { font:600 11px/1 var(--sans); color:var(--mute); padding:16px 9px 7px; }
.run { display:flex; gap:9px; padding:6px 9px; border-radius:8px; font-size:12.5px; } .run:hover { background:var(--hover); }
.run.next .dot { background:#fff; border:2px solid var(--violet); } .run.next small { color:var(--violet-deep); }
.run .dot { width:7px; height:7px; border-radius:50%; margin-top:6px; flex:none; background:#D4D4D8; } .run.running .dot { background:var(--violet); animation:pulse 2s infinite; } .run.done .dot { background:var(--ok); }
.run b { display:block; font-weight:500; font-size:12.5px; } .run small { color:var(--mute); font-size:11px; }
@keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(124,58,237,.45); } 70% { box-shadow:0 0 0 6px rgba(124,58,237,0); } 100% { box-shadow:0 0 0 0 rgba(124,58,237,0); } }
.sidefoot { margin-top:auto; position:sticky; bottom:-14px; background:var(--side); z-index:5; padding:10px 9px 2px; font-size:11px; color:var(--mute); border-top:1px solid var(--rule); line-height:1.55; }

/* conversation */
.chat { position:relative; display:flex; flex-direction:column; border-right:1px solid var(--rule); min-height:0; min-width:0; background:#fff; }
/* draggable divider between the conversation and the workspace */
.split { position:absolute; top:0; bottom:0; right:-4px; width:8px; cursor:col-resize; z-index:20; touch-action:none; }
.split::after { content:""; position:absolute; top:0; bottom:0; left:3px; width:2px; background:transparent; transition:background .15s; }
.split:hover::after, .dragging .split::after { background:var(--violet); }
.dragging, .dragging * { cursor:col-resize !important; user-select:none; }
/* while dragging, a cover over the workspace keeps the pointer in this page. Never pointer-events:none on the iframe itself: Chrome then
   stops scrolling the workspace with the wheel after the drag (2026-10-26) */
.ws { position:relative; } .dragging .ws::after { content:""; position:absolute; inset:0; z-index:10; }
.chead { display:flex; align-items:center; gap:10px; height:52px; padding:0 18px; border-bottom:1px solid var(--rule); flex:none; }
.chead b { font-size:14px; } .chead .muted { font-size:12px; color:var(--mute); }
.live { margin-left:auto; display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink-2); background:var(--soft); border:1px solid var(--vline); border-radius:999px; padding:3px 10px; }
.live i { width:6px; height:6px; border-radius:50%; background:var(--violet); animation:pulse 2s infinite; }
.thread { flex:1; overflow:auto; padding:18px 18px 8px; scroll-behavior:smooth; }
.day { text-align:center; font-size:11px; color:var(--mute); margin:6px 0 14px; }
.msg { display:flex; gap:10px; margin-bottom:16px; } .msg .av { width:26px; height:26px; border-radius:8px; flex:none; display:grid; place-items:center; font:700 11px/1 var(--sans); }
.msg.ai .av { background:linear-gradient(135deg, var(--violet), var(--fuchsia)); color:#fff; } .msg .body { min-width:0; flex:1; }
.msg .who { font-size:11.5px; color:var(--mute); margin-bottom:3px; } .msg .who b { color:var(--ink); font-weight:600; margin-right:6px; }
.msg p { margin:0 0 6px; font-size:13.5px; } .msg.me { justify-content:flex-end; }
.bubble { max-width:84%; background:var(--hover); border-radius:14px 14px 4px 14px; padding:9px 13px; font-size:13.5px; }
.bubble .ctx { display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--violet-deep); background:#fff; border:1px solid var(--vline); border-radius:999px; padding:1px 8px 1px 2px; margin-bottom:6px; }
.bubble .ctx img { width:18px; height:18px; border-radius:50%; object-fit:cover; }
.metaline { font-size:11px; color:var(--mute); text-align:right; margin:-10px 0 14px; }
/* cards */
.card { background:#fff; border:1px solid var(--rule); border-radius:14px; box-shadow:var(--shadow); padding:14px; margin-top:6px; }
.ctype { display:inline-flex; align-items:center; gap:6px; font:600 10.5px/1 var(--sans); letter-spacing:.08em; color:var(--fuchsia); text-transform:uppercase; margin-bottom:8px; }
.card h4 { margin:0 0 8px; font:600 14px/1.45 var(--sans); }
.q { display:grid; grid-template-columns: 56px minmax(0, 1fr); gap:10px; padding:10px 0; border-top:1px solid var(--rule); } .q:first-of-type { border-top:0; padding-top:2px; }
.q img { width:56px; height:56px; border-radius:9px; object-fit:cover; } .q .t { font-size:13px; } .q .t small { color:var(--mute); font-size:11.5px; }
.inp { width:100%; border:1px solid var(--rule); border-radius:9px; padding:7px 10px; font:13px/1.5 var(--sans); margin-top:6px; color:var(--ink); background:#fff; resize:none; }
.inp:focus { outline:none; border-color:var(--violet); box-shadow:0 0 0 3px var(--soft-2); }
.answered { font-size:12.5px; color:var(--ink-2); background:var(--side); border-radius:8px; padding:6px 9px; margin-top:6px; }
.foot { display:flex; align-items:center; gap:8px; margin-top:10px; } .foot .muted { font-size:11.5px; color:var(--mute); margin-left:auto; }
.btn { display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font:600 12.5px/1 var(--sans); padding:8px 13px; border-radius:999px; border:1px solid var(--violet); background:var(--violet); color:#fff; cursor:pointer; box-shadow:0 4px 12px rgba(124,58,237,.22); }
.btn.ghost { background:#fff; color:var(--ink); border-color:var(--rule); box-shadow:none; } .btn.done { background:#F0FDF4; color:var(--ok); border-color:#BBF7D0; box-shadow:none; }
.uiupd { position:fixed; top:10px; left:50%; transform:translateX(-50%); z-index:50; background:#fff; border:1px solid var(--violet); color:var(--ink); padding:6px 8px 6px 14px; border-radius:20px; font-size:13px; box-shadow:0 4px 16px rgba(91,33,182,.18); display:flex; gap:10px; align-items:center; } .uiupd .btn { padding:4px 12px; }
.card.go .rounds { margin:8px 0 4px; font-size:13px; } .card.go .rounds .inp { width:56px; display:inline-block; padding:2px 6px; } .card.go .rounds small { display:block; color:var(--mute); font-size:11.5px; } .card.go .runners { margin:10px 0 4px; } .card.go .opt.rn { grid-template-columns:minmax(0, 1fr); }   /* no letter badge: one full-width column */
.card.go .opt.rn b { word-break:break-word; } .card.go .opt.rn .rec { white-space:nowrap; display:inline-block; } .card.go .rlabel { font-size:12px; color:var(--mute); margin-bottom:6px; } .card.go .opt.rn { padding:8px 10px; margin:4px 0; } .card.go .opt.rn small { display:block; } .card.go .rec { font-size:11px; color:var(--violet); margin-left:8px; }
.msg .files { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; } .msg .files .btn { text-decoration:none; }
.btn.danger { background:#DC2626; border-color:#DC2626; color:#fff; } .btn.danger:hover { background:#B91C1C; }
.opt { display:grid; grid-template-columns: 22px minmax(0, 1fr); gap:10px; padding:9px 10px; border:1px solid var(--rule); border-radius:10px; margin-bottom:6px; cursor:pointer; font-size:13px; }
.opt .k { width:22px; height:22px; border-radius:7px; border:1.5px solid #D4D4D8; font:700 11px/19px var(--sans); text-align:center; color:var(--mute); }
.opt small { display:block; color:var(--mute); font-size:11.5px; line-height:1.5; } .opt b { font-weight:600; }
.opt.on { border-color:var(--violet); background:var(--soft); } .opt.on .k { background:var(--violet); border-color:var(--violet); color:#fff; }
.opt .rec { font-size:10.5px; color:var(--violet-deep); background:var(--soft-2); border-radius:999px; padding:0 6px; margin-left:4px; font-weight:600; }
.cand { display:grid; grid-template-columns: minmax(0, 1fr) auto; gap:10px; align-items:center; padding:10px; border:1px solid var(--rule); border-radius:10px; margin-bottom:6px; }
.cand.on { border-color:var(--violet); background:var(--soft); } .cand b { font-size:13px; font-weight:600; } .cand small { display:block; color:var(--mute); font-size:11.5px; }
.cand audio { width:100%; height:30px; margin-top:6px; }
.und li { margin:3px 0; font-size:13px; } .und { margin:0; padding-left:18px; } .und .edit { color:var(--violet-deep); border-bottom:1px dashed #C4B5EC; }
.res { display:grid; grid-template-columns: 120px minmax(0, 1fr); gap:12px; }
.res img { width:120px; height:68px; object-fit:cover; border-radius:9px; display:block; }
.res .st { font-size:12px; color:var(--ink-2); } .res .st span { display:inline-block; margin-right:8px; }
.perm { background:linear-gradient(180deg, #F0FDF4 0%, #fff 100%); border-color:#BBF7D0; } .perm .ctype { color:var(--ok); }
.perm ul { margin:4px 0 0; padding-left:18px; font-size:12.5px; color:var(--ink-2); }
.go { background:linear-gradient(180deg, var(--soft) 0%, #fff 100%); border-color:var(--vline); }
.task { background:linear-gradient(180deg, var(--soft) 0%, #fff 100%); border-color:var(--vline); }
.task .est { margin-left:8px; font:600 11px/1 var(--sans); letter-spacing:0; text-transform:none; color:var(--violet-deep); background:var(--soft-2); border-radius:999px; padding:3px 8px; }
.task .tbody { margin:0; font-size:13px; color:var(--ink-2); } .task .thint { margin:6px 0 0; font-size:12px; color:var(--mute); }
.go .sum { font-size:12.5px; color:var(--ink-2); margin:4px 0 0; } .go .est { margin:10px 0 0; padding:12px 14px; border:1px solid var(--vline); border-radius:10px; background:#fff; }
.go .est .row { display:flex; gap:28px; flex-wrap:wrap; } .go .est .row span { display:flex; flex-direction:column; gap:2px; }
.go .est .row small { font-size:11.5px; color:var(--mute); } .go .est .row b { font-size:17px; color:var(--ink); font-weight:650; }
.go .est p { margin:8px 0 0; font-size:12.5px; color:var(--ink-2); } .go .est.sub p { color:var(--ink); }
.go .est .enote { display:block; margin-top:4px; font-size:11.5px; color:var(--mute); line-height:1.5; }
.go ol { margin:4px 0 0; padding-left:20px; font-size:12.5px; color:var(--ink-2); }
.meter { margin:8px 0 10px; padding:10px 12px; border:1px solid var(--rule); border-radius:10px; background:#FAFAFB; }
.meter .mrow { display:flex; align-items:center; gap:10px; font-size:13px; margin:3px 0; } .meter .mlab { width:64px; color:var(--mute); font-size:12px; flex:none; }
.meter .dots { display:inline-flex; gap:5px; } .meter .dots i { width:12px; height:12px; border-radius:50%; border:1.5px solid #D4D4D8; }
.meter .dots i.d { background:var(--violet); border-color:var(--violet); } .meter .dots i.c { border-color:var(--violet); border-top-color:transparent; animation:thspin .9s linear infinite; }
.meter .bar { flex:1; max-width:180px; height:7px; background:#ECECF0; border-radius:4px; overflow:hidden; } .meter .bar i { display:block; height:100%; background:var(--violet); }
.meter small { display:block; color:var(--mute); font-size:11.5px; margin-top:4px; }
.prog { list-style:none; padding:0; margin:6px 0 0; } .prog li { display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--mute); padding:2px 0; }
.prog li::before { content:""; width:12px; height:12px; border-radius:50%; border:1.5px solid #D4D4D8; flex:none; }
.prog li.d { color:var(--ink-2); } .prog li.d::before { background:var(--ok); border-color:var(--ok); }
.prog li.c { color:var(--ink); font-weight:500; } .prog li.c::before { border-color:var(--violet); border-top-color:transparent; animation:spin 1s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.livecard .lnow { display:flex; align-items:center; gap:8px; margin:6px 0 2px; font-size:13.5px; color:var(--ink); font-weight:550; }
.livecard .lnow .ring { width:12px; height:12px; border-radius:50%; border:2px solid var(--violet); border-top-color:transparent; animation:spin 1s linear infinite; flex:none; }
.livecard .lnow .time { margin-left:auto; font-size:11.5px; color:var(--mute); font-weight:400; }
.lalert { margin:6px 0; padding:8px 10px; border-radius:8px; font-size:12.5px; line-height:1.5; background:#FFF7E6; color:#7A4B00; border:1px solid #F5D9A3; }
.lalert.died, .lalert.auth { background:#FDECEC; color:#8A1C1C; border-color:#F3C2C2; } .lalert.done { background:#EAF7EF; color:#1E6B3A; border-color:#BFE5CC; }
.lshots { display:flex; gap:6px; margin-top:8px; overflow-x:auto; } .lshots img { height:84px; max-width:46%; border-radius:6px; object-fit:cover; cursor:zoom-in; border:1px solid var(--rule); }
.nbell { cursor:pointer; border:0; font:inherit; } .nbell.off i { background:#C4C4CC; }
.sys.lv { color:var(--ink-2); } .sys.lv.build_pause, .sys.lv.build_stall, .sys.lv.resident_pause, .sys.lv.resident_stall, .sys.lv.gen_stall { color:#7A4B00; }
.composer { flex:none; border-top:1px solid var(--rule); padding:10px 14px 14px; background:#fff; }
.composer .box { border:1px solid var(--rule); border-radius:14px; padding:8px 10px; box-shadow:var(--shadow); }
.composer .box.over { border-color:var(--violet); background:var(--soft); }
.composer textarea { width:100%; border:0; resize:none; font:13.5px/1.6 var(--sans); min-height:44px; outline:none; color:var(--ink); background:transparent; }
.composer .row { display:flex; align-items:center; gap:6px; } .composer .chip { display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--violet-deep); background:var(--soft-2); border-radius:999px; padding:2px 9px; }
.composer .ic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; color:var(--ink-2); cursor:pointer; } .composer .ic:hover { background:var(--hover); }
.mchips { display:flex; flex-wrap:wrap; gap:4px; min-width:0; } .mchip { font:11.5px/1.4 var(--sans); color:var(--ink-2); background:var(--side); border:1px solid var(--rule); border-radius:999px; padding:2px 9px; cursor:pointer; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.mchip:hover { background:var(--hover); } .mchip.ro { cursor:default; } .mchip.ro:hover { background:var(--side); } .mchip b { font-weight:600; color:var(--ink); }
.mmenu .mgrp { font-size:12px; color:var(--mute); margin:12px 0 6px; } .mmenu .opt { grid-template-columns:minmax(0, 1fr); } .mmenu .mfree { display:flex; gap:6px; margin:4px 0 6px; } .mmenu .mfree .inp { flex:1; min-width:0; }
.card.go .bmodel { margin:10px 0 4px; font-size:13px; } .card.go .bmodel .row { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; } .card.go .bmodel small { color:var(--mute); font-size:11.5px; } .card.go .bmodel > small { display:block; }
.card.go .bmodel .bwarn, .mmenu .mwarn { font-size:12px; color:var(--warn); background:#FFFBEB; border-radius:8px; padding:6px 9px; margin:8px 0; } .mmenu .rec.dear { color:var(--warn); }
.mmenu .btn.sm { padding:4px 10px; font-size:12px; } .mmenu .mwarn { font-size:12px; color:var(--warn); background:#FFFBEB; border-radius:8px; padding:6px 9px; margin:8px 0; } .mmenu .mnow { font-size:12px; color:var(--mute); }
.composer .send { margin-left:auto; width:30px; height:30px; border-radius:50%; background:var(--violet); color:#fff; display:grid; place-items:center; border:0; cursor:pointer; }
.hint { font-size:11px; color:var(--mute); margin-top:6px; }

/* workspace */
.ws { display:flex; flex-direction:column; min-width:0; background:#fff; }
.wtabs { display:flex; align-items:center; gap:2px; height:52px; padding:0 14px; border-bottom:1px solid var(--rule); flex:none; }
.wtabs a { display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-2); padding:6px 11px; border-radius:8px; font-weight:500; cursor:pointer; }
.wtabs a:hover { background:var(--hover); } .wtabs a.cur { background:var(--hover); color:var(--ink); }
.lang { margin-left:auto; display:inline-flex; gap:2px; padding:2px; background:#fff; border:1px solid var(--rule); border-radius:999px; flex:none; }
.lang button { border:0; background:none; font:600 11.5px/1 var(--sans); padding:6px 11px; border-radius:999px; color:var(--ink-2); cursor:pointer; min-width:34px; }
.lang button:hover { color:var(--ink); } .lang button.on { background:var(--violet); color:#fff; box-shadow:0 2px 8px rgba(124,58,237,.25); }
.ws iframe { flex:1; border:0; width:100%; }
.ws.flash { animation:wsflash .9s ease-out; } @keyframes wsflash { 0% { box-shadow:inset 0 0 0 3px var(--violet); } 100% { box-shadow:inset 0 0 0 0 transparent; } }

/* live additions: states of the real conversation */
.chead b { flex:none; white-space:nowrap; } .chead > .muted { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } .chead .pills { flex:none; } .live { white-space:nowrap; }
.proj div { min-width:0; } .proj b, .proj span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
.live.off { color:var(--mute); background:var(--side); border-color:var(--rule); } .live.off i { background:#D4D4D8; animation:none; }
.live.run { margin-left:0; } .chead .pills { margin-left:auto; display:flex; gap:6px; } .chead .pills .live { margin-left:0; }
.seen { font-size:11px; color:var(--mute); margin:3px 2px 0; }
.thstate { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--mute); margin:2px 0 14px 36px; }
.thstate .dots { display:inline-flex; gap:3px; } .thstate .dots i { width:5px; height:5px; border-radius:50%; background:var(--violet); opacity:.25; animation:thdot 1.2s infinite ease-in-out; }
.thstate .dots i:nth-child(2) { animation-delay:.2s; } .thstate .dots i:nth-child(3) { animation-delay:.4s; }
.thstate .ring { width:11px; height:11px; border-radius:50%; border:2px solid var(--vline); border-top-color:var(--violet); animation:thspin .8s linear infinite; display:inline-block; }
@keyframes thspin { to { transform:rotate(360deg); } }
@keyframes thdot { 0%, 80%, 100% { opacity:.25; } 40% { opacity:1; } }
.offline { flex:none; font-size:12px; color:var(--ink-2); background:#FFFBEB; border-bottom:1px solid #FDE68A; padding:6px 18px; }
.offline.warn { background:#FEF2F2; border-bottom-color:#FECACA; color:#991B1B; }
.building { flex:none; display:flex; align-items:center; gap:9px; font-size:12px; color:var(--violet-deep); background:var(--soft); border-bottom:1px solid var(--vline); padding:6px 18px; }

@container (max-width: 520px) { .chead > b, .chead > .muted { display:none; } .chead .pills { margin-left:0; } }
@container (max-width: 480px) { .help span:not(.q) { display:none; } .help { padding:0 8px; } }
@container (max-width: 860px) { .wtabs a:not(.cur) span { display:none; } .wtabs a { padding:6px 9px; } .wtabs a.cur { flex:none; } }
/* phones (QA 2026-10-29: at 390 px the workspace was 0 px wide and the page scrolled sideways): one column, a bar at the top switches
   between the conversation and the workspace, the sidebar is a drawer */
.mbar, .mscrim { display:none; }
@media (max-width: 760px) {
  html, body { height:100%; overflow:hidden; }
  .app { grid-template-columns:minmax(0, 1fr); grid-template-rows:auto minmax(0, 1fr); height:100vh; height:100dvh; }
  .mbar { display:flex; align-items:center; gap:8px; grid-row:1; grid-column:1; padding:6px 10px; border-bottom:1px solid var(--rule); background:var(--side); min-width:0; }
  .mbar .mb-menu { flex:none; width:34px; height:34px; border-radius:9px; border:1px solid var(--rule); background:#fff; display:grid; place-items:center; color:var(--ink-2); cursor:pointer; padding:0; }
  .mbar .mb-title { flex:1; min-width:0; font:600 13px/1.3 var(--sans); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mbar .mb-seg { flex:none; display:inline-flex; gap:2px; padding:2px; background:#fff; border:1px solid var(--rule); border-radius:999px; }
  .mbar .mb-seg button { border:0; background:none; font:600 12.5px/1 var(--sans); padding:8px 12px; border-radius:999px; color:var(--ink-2); cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .mbar .mb-seg button.on { background:var(--violet); color:#fff; } .mbar .mb-seg .cnt { font-size:10.5px; background:var(--soft-2); color:var(--violet-deep); border-radius:10px; padding:1px 6px; }
  .app > .chat, .app > .ws { grid-row:2; grid-column:1; min-height:0; }
  body:not(.m-ws) .app > .ws { display:none; } body.m-ws .app > .chat { display:none; }
  .sidenav { position:fixed; top:0; bottom:0; left:0; width:min(290px, 86vw); z-index:85; transform:translateX(-104%); transition:transform .2s ease; box-shadow:var(--shadow-lg); }
  body.m-side .sidenav { transform:none; } body.m-side .mscrim { display:block; position:fixed; inset:0; z-index:84; background:rgba(24,24,27,.35); }
  .split { display:none; }
  .chat { border-right:0; }
  .chead { height:46px; padding:0 10px; gap:6px; } .chead > b, .chead > .muted { display:none; } .chead .pills { margin-left:0; flex:1; min-width:0; overflow:hidden; }
  .help { padding:0 8px; } .help span:not(.q) { display:none; }
  .thread { padding:12px 10px 6px; } .thstate { margin-left:0; }
  .composer { padding:8px 8px 10px; } .composer .hint { display:none; } .composer .row { flex-wrap:wrap; }
  .mchips { flex:1; } .mchip { max-width:calc(100vw - 120px); overflow:hidden; text-overflow:ellipsis; }
  .bubble, .msg.me .col { max-width:92%; }
  .q { grid-template-columns:40px minmax(0, 1fr); } .q img { width:40px; height:40px; }
  .res { grid-template-columns:minmax(0, 1fr); } .res img { width:100%; height:auto; aspect-ratio:16/9; }
  .foot { flex-wrap:wrap; } .card { padding:12px; }
  .go .est .row { gap:16px; }
  .wtabs { height:46px; padding:0 8px; overflow-x:auto; scrollbar-width:none; } .wtabs::-webkit-scrollbar { display:none; }
  .flow { padding:6px 10px 7px; gap:5px; }
  .fsteps { flex:1 1 100%; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; } .fsteps::-webkit-scrollbar { display:none; }
  .fgo { margin-left:0; flex:1 1 100%; justify-content:flex-start; } .fhint { display:none; } .fnext { padding:6px 12px; }
  .offline, .building, .hubbar { padding-left:10px; padding-right:10px; }
  #toast { bottom:72px; max-width:calc(100vw - 32px); white-space:normal; text-align:center; border-radius:14px; }
  .wl { padding:12px 16px 36px; } .wl-hero { padding:28px 0 18px; } .wl-hero h1 { font-size:25px; } .wl-hero .lede { font-size:14.5px; }
  .wl-ex, .wl-projects, .wl-how { grid-template-columns:minmax(0, 1fr); }
  .mbox, .mbox.wiz { padding:16px; } .kgrid { grid-template-columns:minmax(0, 1fr); } .kcard img { aspect-ratio:16/5; }
  .modal { padding:10px; }
}
</style>
