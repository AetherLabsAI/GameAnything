# Materials of vanilla villager walk sheets (first 4 rows = walking down / right / up / left), labelled by eye from per-colour
# masks (`gameanything art masks <villager>`). A colour maps to one material, or to several by frame-local row range when the game
# reuses one colour in two places (e.g. Haley's eye colour is also her shoe colour): [[material, first_row, last_row], ...].
# Materials a look does not recolour keep their vanilla colours. The game's art is not copied anywhere: the tool reads the
# sheets from the user's own unpacked Content folder.
#
# fit: what this villager is a good base for (upper / lower body), to help pick parts for a person.

